<style>
  /* ==================================================
     DESIGN TOKENS
     "Modern Government Dashboard" — dominan putih, biru muda
     sebagai warna utama, merah sebagai AKSEN (bukan warna utama).
     ================================================== */
  :root {
    /* Biru — warna utama */
    --kia-blue: #2F6FED;
    --kia-blue-dark: #1D4ED8;
    --kia-blue-darker: #17399E;
    --kia-blue-light: #EAF2FF;
    --kia-blue-lighter: #F5F9FF;
    --kia-blue-ring: rgba(47, 111, 237, 0.16);

    /* Merah — aksen saja */
    --dash-red: #E11D2E;
    --dash-red-dark: #C11424;
    --dash-red-light: #FDECEE;

    /* Netral */
    --kia-ink: #0F2A4A;
    --kia-ink-soft: #33465E;
    --kia-gray: #64748B;
    --kia-gray-soft: #94A3B8;
    --kia-border: #E7ECF3;
    --kia-bg: #F6F9FE;

    /* Status fungsional (bukan warna brand) */
    --kia-success: #15803D;
    --kia-success-bg: #DEF7E7;
    --kia-warning: #92400E;
    --kia-warning-bg: #FEF3C7;

    /* Bentuk & bayangan */
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-xs: 0 1px 2px rgba(15, 42, 74, 0.04);
    --shadow-sm: 0 4px 14px rgba(15, 42, 74, 0.06);
    --shadow-md: 0 10px 30px rgba(15, 42, 74, 0.09);
    --shadow-lg: 0 18px 48px rgba(15, 42, 74, 0.16);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background-color: var(--kia-bg);
    font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--kia-ink-soft);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Garis aksen tipis di puncak halaman — sentuhan identitas resmi
     instansi pemerintah, halus & tidak mengganggu. */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--kia-blue) 0%, var(--kia-blue) 70%, var(--dash-red) 100%);
    z-index: 1400;
  }

  h1, h2, h3, h4, h5, h6 { color: var(--kia-ink); letter-spacing: -0.01em; }

  a { color: var(--kia-blue); }

  ::selection { background: var(--kia-blue-light); color: var(--kia-ink); }

  /* Fokus keyboard tetap terlihat jelas (aksesibilitas), tapi rapi */
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--kia-blue);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .hidden { display: none !important; }
  .gap-2 { gap: 8px; }

  /* ==================================================
     HEADER / NAVBAR
     ================================================== */
  .app-header {
    background: #ffffff;
    color: var(--kia-ink);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--kia-border);
    box-shadow: var(--shadow-xs);
    position: sticky;
    top: 0;
    z-index: 1000;
  }

  .header-logo-wrapper { flex-shrink: 0; }

  .header-logo-img {
    height: 44px;
    width: 44px;
    object-fit: contain;
    background: var(--kia-blue-lighter);
    border: 1px solid var(--kia-border);
    border-radius: 12px;
    padding: 5px;
  }

  .header-logo-fallback {
    height: 44px;
    width: 44px;
    border-radius: 12px;
    background: linear-gradient(155deg, var(--kia-blue), var(--kia-blue-darker));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    line-height: 1.1;
  }
  .header-logo-fallback span { letter-spacing: 0.03em; }

  .app-header-text h1 {
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--kia-ink);
    margin: 0;
  }

  .app-header-text p {
    font-size: 0.78rem;
    margin: 0;
    color: var(--kia-gray);
  }

  /* Tag peran (SEKOLAH/DINAS/CAPIL) di header dashboard */
  .role-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--kia-blue-light);
    color: var(--kia-blue-dark);
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 3px 10px;
    border-radius: 999px;
    margin-top: 4px;
  }
  .role-tag::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--kia-blue);
    display: inline-block;
  }

  /* ==================================================
     MAIN CONTAINER (form Orang Tua)
     ================================================== */
  .app-main {
    max-width: 720px;
    margin: 28px auto;
    padding: 0 16px 64px;
  }

  .step-card {
    background: #fff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 26px 24px;
    margin-bottom: 18px;
    border: 1px solid var(--kia-border);
    animation: kiaFadeUp 0.35s var(--ease) both;
  }

  .step-card h2 {
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--kia-ink);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .step-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 9px;
    background: var(--kia-blue-light);
    color: var(--kia-blue-dark);
    font-size: 0.8rem;
    font-weight: 800;
    flex-shrink: 0;
  }

  .form-label {
    font-weight: 600;
    font-size: 0.84rem;
    color: var(--kia-ink-soft);
    margin-bottom: 5px;
  }

  .form-text-small { font-size: 0.78rem; color: var(--kia-gray); }

  .school-info-box {
    background: var(--kia-blue-lighter);
    border: 1px solid var(--kia-border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-top: 12px;
  }

  .school-info-box .label { font-size: 0.7rem; color: var(--kia-gray); text-transform: uppercase; letter-spacing: 0.04em; }
  .school-info-box .value { font-weight: 600; color: var(--kia-ink); margin-bottom: 8px; }

  .alert-npsn-error {
    font-size: 0.85rem;
    margin-top: 8px;
  }

  .field-error {
    color: var(--dash-red);
    font-size: 0.78rem;
    margin-top: 5px;
    display: none;
  }

  .is-invalid ~ .field-error,
  .field-error.show { display: block; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
  }
  .status-pill.lengkap { background: var(--kia-success-bg); color: var(--kia-success); }
  .status-pill.belum { background: var(--kia-warning-bg); color: var(--kia-warning); }

  .success-box {
    text-align: center;
    padding: 34px 10px 12px;
  }
  .success-box .icon-circle {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: var(--kia-success-bg);
    color: var(--kia-success);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.1rem;
    margin: 0 auto 18px;
    animation: kiaPopIn 0.4s var(--ease) both;
  }

  @media (max-width: 480px) {
    .app-header-text h1 { font-size: 0.92rem; }
    .app-header-text p { font-size: 0.7rem; }
    .step-card { padding: 18px 16px; border-radius: var(--radius-md); }
  }

  /* ==================================================
     FOTO, TANDA TANGAN, DOKUMEN
     ================================================== */

  .upload-preview-img {
    max-width: 160px;
    max-height: 200px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--kia-border);
    object-fit: cover;
    box-shadow: var(--shadow-xs);
  }

  .signature-wrapper {
    border: 1.5px dashed #c7d6f2;
    border-radius: var(--radius-sm);
    background: #fff;
    overflow: hidden;
    touch-action: none;
    transition: border-color 0.2s var(--ease);
  }
  .signature-wrapper:focus-within { border-color: var(--kia-blue); }

  #signatureCanvas {
    width: 100%;
    height: 220px;
    display: block;
    cursor: crosshair;
    background:
      repeating-linear-gradient(#fff, #fff 100%),
      repeating-linear-gradient(0deg, #f8fafc, #f8fafc 1px, transparent 1px, transparent 100%);
  }

  .signature-preview-box {
    border: 1px solid var(--kia-border);
    border-radius: var(--radius-sm);
    background: repeating-conic-gradient(#f1f5f9 0% 25%, #ffffff 0% 50%) 50% / 16px 16px;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }

  .signature-preview-box img {
    max-height: 70px;
    max-width: 100%;
  }

  /* Label jenjang otomatis (dari Bentuk Pendidikan sekolah) */
  .jenjang-auto-box {
    background: var(--kia-blue-lighter);
    border: 1px solid var(--kia-border);
    border-radius: var(--radius-sm);
    padding: 9px 14px;
    display: inline-flex;
    align-items: center;
  }
  .jenjang-auto-box .badge-status { font-size: 0.8rem; padding: 4px 14px; }

  /* ==================================================
     BOOTSTRAP OVERRIDES — form, tombol, alert
     (dipakai di seluruh halaman: Orang Tua, Sekolah, Dinas, Capil)
     ================================================== */

  .form-control, .form-select {
    border: 1.5px solid var(--kia-border);
    border-radius: var(--radius-sm);
    padding: 9px 13px;
    font-size: 0.9rem;
    color: var(--kia-ink);
    background-color: #fff;
    transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  .form-control:focus, .form-select:focus {
    border-color: var(--kia-blue);
    box-shadow: 0 0 0 4px var(--kia-blue-ring);
  }
  .form-control::placeholder { color: var(--kia-gray-soft); }
  .form-control-sm.form-select, .form-select-sm { padding: 6px 11px; font-size: 0.82rem; border-radius: 9px; }

  .form-check-input {
    border: 1.5px solid #c7d2e2;
    width: 1.15em; height: 1.15em;
    margin-top: 0.2em;
  }
  .form-check-input:checked { background-color: var(--kia-blue); border-color: var(--kia-blue); }
  .form-check-input:focus { box-shadow: 0 0 0 4px var(--kia-blue-ring); }
  .form-check-label { font-size: 0.86rem; color: var(--kia-ink-soft); }

  .btn {
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 0.88rem;
    padding: 9px 18px;
    transition: transform 0.12s var(--ease), box-shadow 0.15s var(--ease),
                background-color 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
    border-width: 1.5px;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { transform: none; }

  .btn-kia-primary {
    background-color: var(--kia-blue);
    border-color: var(--kia-blue);
    color: #fff;
    box-shadow: 0 2px 8px rgba(47, 111, 237, 0.25);
  }
  .btn-kia-primary:hover {
    background-color: var(--kia-blue-dark);
    border-color: var(--kia-blue-dark);
    color: #fff;
    box-shadow: 0 6px 16px rgba(47, 111, 237, 0.32);
    transform: translateY(-1px);
  }
  .btn-kia-primary:disabled { background-color: #9db8f2; border-color: #9db8f2; box-shadow: none; }

  .btn-outline-secondary {
    color: var(--kia-ink-soft);
    border-color: var(--kia-border);
    background: #fff;
  }
  .btn-outline-secondary:hover {
    background: var(--kia-bg);
    border-color: #c9d4e3;
    color: var(--kia-ink);
    transform: translateY(-1px);
  }

  .btn-outline-primary {
    color: var(--kia-blue);
    border-color: var(--kia-blue);
    background: #fff;
  }
  .btn-outline-primary:hover {
    background: var(--kia-blue-light);
    color: var(--kia-blue-dark);
    border-color: var(--kia-blue);
    transform: translateY(-1px);
  }

  .btn-outline-danger:hover { transform: translateY(-1px); }

  .alert {
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    font-size: 0.86rem;
    padding: 12px 14px;
  }
  .alert-danger { background: var(--dash-red-light); color: var(--dash-red-dark); border-color: #f6c7cc; }
  .alert-warning { background: var(--kia-warning-bg); color: var(--kia-warning); border-color: #fde3ad; }
  .alert-success { background: var(--kia-success-bg); color: var(--kia-success); border-color: #bfe8cd; }

  /* ==================================================
     DASHBOARD (Sekolah / Dinas / Capil)
     ================================================== */

  .dash-body { background-color: var(--kia-bg); min-height: 100vh; }

  .dash-main { max-width: 1180px; margin: 0 auto; padding: 24px 18px 64px; }

  /* LOGIN CARD */
  .login-wrapper {
    max-width: 420px;
    margin: 64px auto;
    padding: 0 16px;
  }
  .login-card {
    background: #fff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--kia-border);
    padding: 36px 30px;
    text-align: center;
    animation: kiaFadeUp 0.35s var(--ease) both;
  }
  .login-card-icon {
    width: 54px; height: 54px;
    border-radius: 14px;
    background: var(--kia-blue-light);
    color: var(--kia-blue-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    margin: 0 auto 16px;
  }
  .login-card h3 { color: var(--kia-ink); font-weight: 800; margin-bottom: 6px; font-size: 1.25rem; }
  .login-card p.subtitle { color: var(--kia-gray); font-size: 0.85rem; margin-bottom: 22px; line-height: 1.5; }

  /* STAT CARDS */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .stat-card {
    background: #fff;
    border-radius: var(--radius-md);
    padding: 18px 20px;
    box-shadow: var(--shadow-xs);
    border: 1px solid var(--kia-border);
    border-top: 3px solid var(--kia-blue);
    transition: box-shadow 0.2s var(--ease), transform 0.2s var(--ease);
  }
  .stat-card:hover { box-shadow: var(--shadow-sm); transform: translateY(-2px); }
  .stat-card.accent-red { border-top-color: var(--dash-red); }
  .stat-card .stat-label {
    font-size: 0.74rem;
    color: var(--kia-gray);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .stat-card .stat-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    border-radius: 9px;
    background: var(--kia-blue-light);
    color: var(--kia-blue-dark);
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stat-card.accent-red .stat-icon { background: var(--dash-red-light); color: var(--dash-red); }
  .stat-card .stat-value {
    font-size: 1.65rem;
    font-weight: 800;
    color: var(--kia-ink);
    line-height: 1;
  }
  .stat-card .stat-value.text-red { color: var(--dash-red); }
  .stat-card .stat-value.text-blue { color: var(--kia-blue-dark); }

  /* PANEL / SECTION */
  .dash-panel {
    background: #fff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
    padding: 22px 22px 24px;
    margin-bottom: 20px;
    border: 1px solid var(--kia-border);
    animation: kiaFadeUp 0.35s var(--ease) both;
  }
  .dash-panel h5 {
    color: var(--kia-ink);
    font-weight: 700;
    font-size: 0.98rem;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* FILTER BAR */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  .filter-bar select, .filter-bar input {
    font-size: 0.82rem;
  }

  /* TABLE */
  .dash-table-wrapper {
    overflow-x: auto;
    border: 1px solid var(--kia-border);
    border-radius: var(--radius-sm);
  }
  .dash-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.83rem;
    min-width: 640px;
  }
  .dash-table thead th {
    background: var(--kia-blue-lighter);
    color: var(--kia-blue-darker);
    text-align: left;
    padding: 12px 14px;
    font-weight: 700;
    font-size: 0.76rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
    border-bottom: 1px solid var(--kia-border);
  }
  .dash-table tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid #eef2f8;
    vertical-align: middle;
    color: var(--kia-ink-soft);
  }
  .dash-table tbody tr { transition: background-color 0.12s var(--ease); }
  .dash-table tbody tr:hover { background: var(--kia-blue-lighter); }
  .dash-table tbody tr:last-child td { border-bottom: none; }

  /* BADGES */
  .badge-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .badge-status::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    display: inline-block;
    flex-shrink: 0;
  }
  .badge-lengkap, .badge-sudah-submit { background: var(--kia-success-bg); color: var(--kia-success); }
  .badge-belum-lengkap, .badge-belum-mengisi { background: var(--dash-red-light); color: var(--dash-red); }
  .badge-sedang-mengisi, .badge-siap-submit { background: var(--kia-warning-bg); color: var(--kia-warning); }
  .badge-neutral { background: #eef1f6; color: var(--kia-gray); }

  .btn-link-doc, .btn-link-foto {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    border: 1.5px solid transparent;
    transition: all 0.15s var(--ease);
  }
  .btn-link-doc {
    color: #fff;
    background: var(--kia-blue);
  }
  .btn-link-doc:hover { background: var(--kia-blue-dark); transform: translateY(-1px); }
  .btn-link-foto {
    color: var(--kia-blue);
    background: #fff;
    border-color: var(--kia-blue);
  }
  .btn-link-foto:hover { background: var(--kia-blue-light); transform: translateY(-1px); }
  .btn-link-doc:disabled, .btn-link-foto:disabled { opacity: 0.55; cursor: default; transform: none; }

  /* MODAL (generik, dipakai untuk konfirmasi & preview dokumen) */
  .dash-modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(15, 32, 58, 0.55);
    backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1050;
    padding: 16px;
    animation: kiaFadeIn 0.15s var(--ease);
  }
  .dash-modal-backdrop.hidden { display: none; }
  .dash-modal-box {
    background: #fff;
    border-radius: var(--radius-lg);
    max-width: 520px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    padding: 24px;
    box-shadow: var(--shadow-lg);
    animation: kiaPopIn 0.2s var(--ease) both;
  }
  .dash-modal-box.wide { max-width: 760px; }
  .dash-modal-box h5 { color: var(--kia-ink); font-weight: 700; margin-bottom: 14px; }
  .dash-modal-box img, .dash-modal-box iframe {
    max-width: 100%;
    border-radius: var(--radius-sm);
    border: 1px solid var(--kia-border);
  }

  /* TOAST NOTIFIKASI */
  .toast-container-dash {
    position: fixed;
    top: 18px; right: 16px;
    z-index: 1100;
    display: flex; flex-direction: column; gap: 8px;
    max-width: 320px;
  }
  .toast-dash {
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 600;
    color: #fff;
    box-shadow: var(--shadow-md);
    animation: dashToastIn 0.2s var(--ease);
  }
  .toast-dash.success { background: #15803d; }
  .toast-dash.error { background: var(--dash-red); }
  .toast-dash.info { background: var(--kia-blue); }
  @keyframes dashToastIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* LOADING OVERLAY */
  .loading-overlay-dash {
    position: fixed; inset: 0;
    background: rgba(246, 249, 254, 0.82);
    backdrop-filter: blur(1px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1200;
  }
  .loading-overlay-dash.hidden { display: none; }
  .spinner-dash {
    width: 42px; height: 42px;
    border: 4px solid var(--kia-blue-light);
